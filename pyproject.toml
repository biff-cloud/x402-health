[project]
name = "x402-health-mcp"
version = "1.0.0"
description = "MCP server: check x402 endpoints and find reliable x402 services (paid per call, USDC on Solana)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "x402[svm,httpx]==2.25.0", "httpx"]

[project.scripts]
x402-health-mcp = "mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_server"]
