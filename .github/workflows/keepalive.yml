name: keepalive
# Pings the free Render instance (free endpoint only) so it stays warm and the crawler keeps building history.
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 https://x402-health.onrender.com/health
